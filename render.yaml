services:
  - type: web
    name: vamous-clips-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_PATH
        value: vamous_clips.db
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: STREAMERS
        value: Leb1ga,Kavalets,Ghostik,viktoriia_tori,mikhailo_lebiga
